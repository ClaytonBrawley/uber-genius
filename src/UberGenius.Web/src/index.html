<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UberGeniusWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the saved/system theme before Angular loads, so there's no
    // flash of the wrong theme on first paint. Kept in sync with the same
    // logic in ThemeService (src/app/theme/theme.service.ts).
    (function () {
      var stored = localStorage.getItem('theme-preference');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
