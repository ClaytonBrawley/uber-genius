<section class="mx-auto mt-16 max-w-sm">
  <h2 class="text-xl font-semibold tracking-tight text-ink">Sign up</h2>
  <p class="mt-1 text-sm text-ink-muted">Create an account to upload your own data.</p>

  <form class="mt-6 rounded-card border border-line bg-surface p-6" (ngSubmit)="submit()">
    <label class="block text-sm font-medium text-ink" for="displayName">Name</label>
    <input
      id="displayName"
      name="displayName"
      type="text"
      required
      autocomplete="name"
      [(ngModel)]="displayName"
      class="mt-1 w-full rounded-control border border-line bg-canvas px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent"
    />

    <label class="mt-4 block text-sm font-medium text-ink" for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      required
      autocomplete="email"
      [(ngModel)]="email"
      class="mt-1 w-full rounded-control border border-line bg-canvas px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent"
    />

    <label class="mt-4 block text-sm font-medium text-ink" for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      minlength="8"
      autocomplete="new-password"
      [(ngModel)]="password"
      class="mt-1 w-full rounded-control border border-line bg-canvas px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent"
    />
    <p class="mt-1 text-xs text-ink-muted">At least 8 characters.</p>

    @if (error()) {
      <p class="mt-4 text-sm text-danger">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-6 w-full rounded-control bg-accent px-4 py-2 text-sm font-medium text-accent-ink transition-colors hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-50"
    >
      Sign up
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-ink-muted">
    Already have an account?
    <a routerLink="/login" class="text-accent hover:underline">Log in</a>
  </p>
</section>
