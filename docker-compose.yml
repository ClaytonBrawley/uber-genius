services:
  sql-server:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: uber-genius-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1433"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sql-data: